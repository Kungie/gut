name: Site

# The site lives at https://gutpy.dev, served from site/ in this repository. GitHub Pages, its
# old address, now publishes only redirects: every page sends its reader to the same page there.
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - run: python3 scripts/build_site.py --redirects _pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v5
