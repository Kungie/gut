name: Release

# Push a tag like v0.2.0 and this publishes gutfeel 0.2.0 and gutfeel-mcp 0.2.0 to PyPI.
#
# No token is stored anywhere: PyPI trusts this workflow directly (trusted publishing, OIDC), which
# has to be set up once on pypi.org -- see CONTRIBUTING.md. A tag that does not match the version
# in pyproject.toml is refused before anything is built.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: tag matches the version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - run: uv sync --extra jev
      - name: checks
        run: |
          uv run ruff check .
          uv run mypy
          uv run pytest
      - run: uv build --all-packages
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gutfeel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    # The MCP Registry entry (server.json) follows every release. The registry checks that
    # gutfeel-mcp's README on PyPI names io.github.Kungie/gut, so this waits for PyPI to have it.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: install mcp-publisher
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: wait for PyPI to serve the release
        run: |
          version=${GITHUB_REF_NAME#v}
          for attempt in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/gutfeel-mcp/$version/json" >/dev/null && exit 0
            sleep 10
          done
          echo "::error::gutfeel-mcp $version did not appear on PyPI"; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "gutfeel ${GITHUB_REF_NAME#v}" --generate-notes
