[project]
name = "gutfeel-mcp"
version = "0.7.3"
description = "gut's judgment calls as MCP tools: likely, classify, rate and each, answered by small models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Eren Kahraman", email = "kahraman1234eren@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "classification", "jev", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The server itself lives in gutfeel (gut._mcp); this package is its dependencies and its command,
# so that `uvx gutfeel-mcp` is all an MCP client needs. Released in lockstep with gutfeel.
dependencies = [
    "gutfeel==0.7.3",
    "mcp>=2.2,<3",
    "typesafe-sdk>=0.7",
]

[project.scripts]
gutfeel-mcp = "gutfeel_mcp:main"

[project.urls]
Homepage = "https://gutpy.dev/docs/mcp.html"
Repository = "https://github.com/Kungie/gut"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gutfeel_mcp"
module-root = "src"

[tool.uv.sources]
gutfeel = { workspace = true }
