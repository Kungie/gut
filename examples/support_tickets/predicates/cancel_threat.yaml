# Generated from tickets.json by build_predicates.py. The labels are the answer key that
# ships with the dataset; the questions are worded the way after.py asks them.
#
# min_accuracy was set before measuring anything: 0.85 is a defensible bar for triage where a
# wrong call is recoverable. It was not adjusted afterwards to make the numbers look better.
question: "the customer is at risk of leaving: they threaten to cancel, say they will not renew, or describe being close to giving up on the product"
min_accuracy: 0.85
