[project]
name = "gut"
version = "0.0.1"
description = "A gut feeling that knows when to ask. Judgment calls in Python, in one line, that can also answer UNSURE."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Eren Kahraman", email = "kahraman1234eren@gmail.com" }]
keywords = ["llm", "classification", "decision", "uncertainty", "jev", "typesafe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Framework :: Pytest",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7"]
plot = ["matplotlib>=3.8"]

[project.scripts]
gut = "gut._cli:main"

[project.urls]
Homepage = "https://github.com/Kungie/gut"
Repository = "https://github.com/Kungie/gut"
Issues = "https://github.com/Kungie/gut/issues"

[project.entry-points.pytest11]
gut = "gut.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.6",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "matplotlib>=3.8",
    "anyio>=4.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gut"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.format]
# Keep hand-aligned comments in README/docs code blocks intact.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "PTH",       # flake8-use-pathlib
    "RUF",       # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[[tool.mypy.overrides]]
# An optional extra, absent from a core install; its own stubs are used when it is present.
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples", "benchmarks"]
mypy_path = "examples/support_tickets"
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "live: hits the real Jev API; skipped unless TYPESAFE_API_KEY is set",
    "evals: predicate example-file evaluations; run with --gut-evals",
]

[tool.coverage.run]
source = ["src/gut"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
show_missing = true
fail_under = 95
