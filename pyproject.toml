[project]
name = "gutfeel"
version = "0.8.1"
description = "Judgment calls as one line of Python, on small, fast, cheap models. likely / classify / rate, answering YES, NO or UNSURE, on any backend."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Eren Kahraman", email = "kahraman1234eren@gmail.com" }]
keywords = [
    "classification",
    "zero-shot",
    "small-language-models",
    "llm",
    "nli",
    "logprobs",
    "decision",
    "uncertainty",
    "ollama",
    "transformers",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Models that run in-process: TransformersBackend and ZeroShotBackend.
local = ["transformers>=4.56", "torch>=2.2"]
# TypeSafe AI's Jev.
jev = ["typesafe-sdk>=0.7"]
# The MCP server's command, `gutfeel-mcp`, which is also a package of its own so that
# `uvx gutfeel-mcp` works alone. It brings the MCP SDK, and Jev's: the model the server asks first.
mcp = ["gutfeel-mcp==0.8.1"]

[project.scripts]
gut = "gut._cli:entry"
gutfeel = "gut._cli:entry"

[project.urls]
Homepage = "https://gutpy.dev/"
Documentation = "https://gutpy.dev/docs/"
Changelog = "https://github.com/Kungie/gut/releases"
Repository = "https://github.com/Kungie/gut"
Issues = "https://github.com/Kungie/gut/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage[toml]>=7.6",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "anyio>=4.0",
    "mcp>=2.2,<3",
    "gutfeel-mcp",
]

[tool.uv.workspace]
members = ["packages/gutfeel-mcp"]

[tool.uv.sources]
gutfeel-mcp = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gut"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.format]
# Keep hand-aligned comments in README/docs code blocks intact.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "PTH",       # flake8-use-pathlib
    "RUF",       # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The site builder is mostly HTML templates, whose lines are as long as the markup.
"scripts/build_site.py" = ["E501"]

[[tool.mypy.overrides]]
# fontTools draws the README's wordmark (scripts/make_wordmark.py); it is run with `uv run --with`.
module = ["fontTools", "fontTools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The `local` extra, absent from a core install and from CI. Used only through `Any`.
module = ["torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples", "scripts", "packages/gutfeel-mcp/src"]
mypy_path = "examples"
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "live: talks to a real hosted model or server; skipped unless one is configured",
    "local: downloads and runs real local models; skipped unless the [local] extra is installed",
]

[tool.coverage.run]
source = ["src/gut"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
show_missing = true
fail_under = 95
